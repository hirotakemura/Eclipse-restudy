<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOBO — ヒアリング</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">KOBO<span>v0.1</span></div>
  <div class="project">
    <select id="project-select" aria-label="案件"></select>
    <button id="new-project" type="button">＋ 新規案件</button>
  </div>
  <div class="meters">
    <div class="meter">
      <span class="meter-label">充足率</span>
      <div class="bar"><i id="bar-filled"></i></div>
      <strong id="pct-filled">—</strong>
    </div>
    <div class="meter">
      <span class="meter-label">消化率</span>
      <div class="bar covered"><i id="bar-covered"></i></div>
      <strong id="pct-covered">—</strong>
    </div>
  </div>
  <div id="save-status" class="save-status">—</div>
</header>

<div id="empty" class="empty">
  <p>案件を選ぶか、新規に作成してください。</p>
</div>

<main id="main" hidden>
  <nav id="blocks"></nav>
  <section id="form"></section>
</main>

<footer>
  <div id="missing-summary"></div>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
