<!--
  KOBO 内製の素材。金属のヘアライン。静か・上質の型（luxury）と製品・開発の型（product）向け。

  **自社で作ったので権利の確認が要らない**（license.holder = KOBO）。
  **会社の物・人・製品は写っていない**ので、お客様の実績と取り違えられない。

  【乱れでは作れなかった】
  最初は他の3枚と同じ `feTurbulence` で作ったが、**画面ではほぼ何も見えなかった**
  （縦の周波数を上げるほど、線が1px を割って平らな灰色に均される）。
  **見えない装飾は、足していないのと同じである**（D-357と同じ形）。
  金属のヘアラインは**規則的な仕上げ**なので、乱れではなく**線そのもの**で描く。

  【方眼との描き分け】
  方眼（`motif="grid"`）は**縦横の両方**に線がある。ここは**横一方向だけ**、
  3px 間隔・1px・黒の 6% なので、格子ではなく「表面の仕上げ」として読める。

  地が透けるように、白い下地は敷いていない。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="6" height="6" viewBox="0 0 6 6">
  <rect y="0" width="6" height="1" fill="#000" opacity="0.06"/>
  <rect y="3" width="6" height="1" fill="#000" opacity="0.06"/>
</svg>
