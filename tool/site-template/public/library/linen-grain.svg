<!--
  KOBO 内製の素材。布の目。紙より粗く、方向がある。手仕事の型（craft）向け。

  **自社で作ったので権利の確認が要らない**（license.holder = KOBO）。
  **会社の物・人・製品は写っていない**ので、お客様の実績と取り違えられない。

  【格子で描かない】
  最初は 6px の縦横の線で作ったが、**画面で見たら方眼紙にしか見えなかった。**
  方眼は `motif="grid"` が持っている別の語で、**同じものを2つの名前で描くことになる。**
  横方向に伸ばした乱れ（baseFrequency の縦横を変える）にすると、繊維の向きが出て、
  格子とは別のものになる。

  地が透けるように、白い下地は敷いていない。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <filter id="w" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04 1.1" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="200" height="200" filter="url(#w)" opacity="0.10"/>
</svg>
