<!--
  KOBO 内製の素材。紙の目。

  **自社で作ったので権利の確認が要らない**（license.holder = KOBO）。
  **会社の物・人・製品は写っていない**ので、お客様の実績と取り違えられない。

  地が透けるように、白い下地は敷いていない。帯の地の上に重ねて使う。
  `stitchTiles="stitch"` は、繰り返して敷いたときに継ぎ目を出さないため。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="240" height="240" filter="url(#g)" opacity="0.10"/>
</svg>
