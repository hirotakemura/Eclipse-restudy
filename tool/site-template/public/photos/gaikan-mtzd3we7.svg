<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="事業所の外観（仮の画像）">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa0ae"/><stop offset="1" stop-color="#5b6b7a"/>
    </linearGradient>
    <pattern id="p" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="48" height="48" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="48" stroke="#ffffff" stroke-opacity="0.06" stroke-width="14"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <rect width="1200" height="900" fill="url(#p)"/>
  <text x="50%" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="64" fill="#ffffff" fill-opacity="0.92">事業所の外観</text>
  <text x="50%" y="506" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" fill="#ffffff" fill-opacity="0.7">仮の画像（外観）／差し替え前提</text>
</svg>
